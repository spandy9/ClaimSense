name: Build policy knowledge base

on:
  push:
    branches: [dev]
    paths:
      - "data/policies/new_india/policy_wording.pdf"
      - "data/policies/new_india/excluded_items.pdf"
      - "src/ingestion/build_policy_knowledge_base.py"
      - "src/ingestion/extract_policy_clauses.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/build-policy-knowledge-base.yml"
  workflow_dispatch:

concurrency:
  group: policy-knowledge-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test pipeline
        run: python -m pytest -q
      - name: Build knowledge base
        run: python src/ingestion/build_policy_knowledge_base.py
      - name: Commit generated knowledge base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge_base/policy_knowledge_base.jsonl data/knowledge_base/manifest.json
          if git diff --cached --quiet; then
            echo "Knowledge base is unchanged."
          else
            git commit -m "build: refresh policy knowledge base"
            git push origin HEAD:dev
          fi
      - name: Upload knowledge base artifact
        uses: actions/upload-artifact@v4
        with:
          name: claimsense-policy-knowledge-base
          path: |
            data/knowledge_base/policy_knowledge_base.jsonl
            data/knowledge_base/manifest.json
          if-no-files-found: error
          retention-days: 30
